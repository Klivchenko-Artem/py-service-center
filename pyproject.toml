[project]
name = "service-center"
version = "1.0.0"
description = "Сервисный центр: заявки на ремонт, админка, права по ролям"
requires-python = ">=3.13"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM", "DJ", "RUF"]
ignore = [
    "RUF001",
    "RUF002",
    "RUF003",
    # list_display и прочие списки в ModelAdmin это общепринятый стиль Django,
    # переписывать их на ClassVar значит спорить с фреймворком
    "RUF012",
]
